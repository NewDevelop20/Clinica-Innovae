<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo chat · Clínica Innovae</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: #1d1a16; color: #f8f3ec;
           font-family: Montserrat, system-ui, sans-serif; display: grid; place-items: center; }
    main { max-width: 560px; padding: 32px 20px; text-align: center; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 44px; margin: 0 0 8px; }
    h1 em { color: #b8965a; }
    p { color: #cfc6b8; line-height: 1.6; }
    button { margin-top: 12px; background: #b8965a; color: #fff; border: 0; border-radius: 999px;
             padding: 12px 22px; font: inherit; cursor: pointer; }
    code { color: #b8965a; }
  </style>
</head>
<body>
  <main>
    <h1>Clínica <em>Innovae</em></h1>
    <p>Página de prueba del asistente. El chat aparece abajo a la derecha.<br>
       En modo simulado, pruebe a escribir <code>Limpieza Facial 2026-10-20</code>
       para consultar la agenda real del Code.gs.</p>
    <button type="button" onclick="InnovaeChat.abrir('Quiero pedir cita')">Probar «Quiero pedir cita»</button>
  </main>
  <!-- Exactamente la línea que irá en index.html (con la URL de Cloud Run): -->
  <script src="/widget/innovae-chat.js" defer></script>
</body>
</html>
